services:
  web-backend:
    build: .
    env_file: .env
    environment:
      CRAZYSOUL_OUTPUT: /data/output
      # 容器內預設 127.0.0.1 只綁 loopback,host 連不到;對外服務須綁所有介面
      CRAZYSOUL_WEB_HOST: 0.0.0.0
    volumes:
      - crazysoul-output:/data/output
    ports:
      - "8000:8000"
    command: ["python", "-m", "crazysoul.web"]

  worker:
    build: .
    env_file: .env
    environment:
      CRAZYSOUL_OUTPUT: /data/output
      CRAZYSOUL_WORKER: "1"
    volumes:
      - crazysoul-output:/data/output
    command: ["python", "-m", "crazysoul.worker"]
    profiles: ["worker"]

  web-frontend:
    build: .
    env_file: .env
    environment:
      CRAZYSOUL_WEB_HOST: 0.0.0.0
    depends_on:
      - web-backend
    ports:
      - "8080:8000"
    command: ["python", "-m", "crazysoul.web"]
    profiles: ["frontend"]

volumes:
  crazysoul-output:
