services:
  web-backend:
    build: .
    command: python -m uvicorn crazysoul.web.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
  worker:
    build: .
    command: python -c "import time; print('CrazySoul worker placeholder ready', flush=True); time.sleep(10**9)"
    env_file: .env
    volumes:
      - ./output:/app/output
  web-frontend:
    image: nginx:1.27-alpine
    depends_on:
      - web-backend
    ports:
      - "8080:80"
    volumes:
      - ./crazysoul/web/static:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
